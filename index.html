    <!-- 自定义通知弹窗 -->
    <div id="toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 glass-panel px-4 py-2 rounded-full text-[9px] tracking-wider opacity-0 pointer-events-none transition-all duration-500 flex items-center space-x-2" style="opacity: 0; pointer-events: none;">
        <i class="fa-solid fa-circle-info text-white/40"></i>
        <span id="toastText" class="text-white/75">从本地记忆中完美唤醒了 1527 幅图像</span>
    </div>

    <!-- 核心图像处理与 Canvas 3D 光影粒子渲染逻辑 -->
    <script>
        // --- 1. 初始化基础配置 ---
        const CONFIG = {
            startDate: new Date('2025-09-01'),
            endDate: new Date('2026-09-01'),
            totalDays: 365,
            
            // 用户控制变量
            heightScale: 1.0,
            glowScale: 1.0,
            orbitSpeed: 0.0,
            noiseLevel: 2
        };

        // IndexedDB 数据库名称与配置
        const DB_NAME = 'ChronoFlowLocalDB';
        const STORE_NAME = 'time_images';
        let db = null;

        // 数据存储：按天(1-365)索引存储上传的图片包
        const timeDataStore = {};
        
        // 审计日志计数器
        const AUDIT = {
            total: 0,
            success: 0,
            skipped: 0
        };

        // 初始化365天的数据槽
        for(let i = 1; i <= CONFIG.totalDays; i++) {
            const currentDate = new Date(CONFIG.startDate);
            currentDate.setDate(CONFIG.startDate.getDate() + (i - 1));
            const y = currentDate.getFullYear();
            const m = String(currentDate.getMonth() + 1).padStart(2, '0');
            const d = String(currentDate.getDate()).padStart(2, '0');
            const dateStr = `${y}-${m}-${d}`;
            
            timeDataStore[i] = {
                dayIndex: i,
                dateStr: dateStr,
                month: currentDate.getMonth() + 1,
                images: [], 
                imageColors: [], 
                totalCount: 0, 
                heightFactor: 0.1 
            };
        }

        // --- 2. 全局提示与 UI 辅助同步函数 (优先声明并初始化，防止 ReferenceError) ---
        function showToast(text) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            const toastText = document.getElementById('toastText');
            if (toastText) toastText.innerText = text;
            toast.style.opacity = '1';
            toast.style.pointerEvents = 'auto';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.pointerEvents = 'none';
            }, 3000);
        }

        // 统一图片总数更新
        function updateImgCountUI() {
            const imgCount = document.getElementById('imgCount');
            if (imgCount) {
                imgCount.innerText = AUDIT.success;
            }
        }

        // --- 3. 初始化 IndexedDB 本地数据库 ---
        function initIndexedDB() {
            return new Promise((resolve) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (e) => {
                    const activeDb = e.target.result;
                    if (!activeDb.objectStoreNames.contains(STORE_NAME)) {
                        activeDb.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(true);
                };
                request.onerror = () => {
                    console.error("IndexedDB初始化失败");
                    resolve(false);
                };
            });
        }

        // 异步向数据库写入一张图片记录
        function saveImageToLocal(dayIndex, dateStr, src, colors) {
            if (!db) return;
            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);
            store.add({ dayIndex, dateStr, src, colors });
        }

        // 异步从数据库读取并加载先前保存的所有图像
        function loadImagesFromLocal() {
            if (!db) return;
            const tx = db.transaction(STORE_NAME, 'readonly');
            const store = tx.objectStore(STORE_NAME);
            const request = store.getAll();
            
            request.onsuccess = () => {
                const records = request.result;
                if (records && records.length > 0) {
                    records.forEach(rec => {
                        const slot = timeDataStore[rec.dayIndex];
                        if (slot) {
                            slot.totalCount++;
                            slot.imageColors.push(...rec.colors);
                            slot.images.push(rec.src);
                            // 线性高度公式：高度严格随数量累加增长
                            slot.heightFactor = 0.1 + slot.totalCount * 0.15;
                        }
                    });
                    
                    // 刷写审计计数和指示器UI
                    AUDIT.total = records.length;
                    AUDIT.success = records.length;
                    document.getElementById('logTotal').innerText = AUDIT.total;
                    document.getElementById('logSuccess').innerText = AUDIT.success;
                    updateImgCountUI();
                    
                    showToast(`从本地记忆中完美唤醒了 ${records.length} 幅图像`);
                }
            };
        }

        // --- 4. Canvas 3D 渲染器核心变量 ---
        const canvas = document.getElementById('artCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let isLinear = false; 
        let zoom = 1.0;
        let targetZoom = 1.0;
        let rotationX = 0.4; 
        let rotationY = 0.0; 
        let targetRotationX = 0.4;
        let targetRotationY = 0.0;
        
        // 独立自转角积累
        let orbitAngle = 0.0; 
        
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;
        
        let hoverIndex = -1; 
        let backgroundParticles = []; 
        let animTick = 0; 

        // 自适应视口
        function resize() {
            width = canvas.width = canvas.clientWidth * window.devicePixelRatio;
            height = canvas.height = canvas.clientHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        // 创建背景漂移星尘粒子
        function initAmbientParticles() {
            backgroundParticles = [];
            for (let i = 0; i < 70; i++) {
                backgroundParticles.push({
                    x: Math.random() * canvas.clientWidth,
                    y: Math.random() * canvas.clientHeight,
                    z: Math.random() * 200,
                    size: Math.random() * 1.0 + 0.3,
                    speed: Math.random() * 0.1 + 0.02,
                    alpha: Math.random() * 0.3 + 0.05
                });
            }
        }
        initAmbientParticles();

        // 辅助：获取两日期天数差
        function getDayIndex(dateStr) {
            const target = new Date(dateStr);
            if (isNaN(target)) return -1;
            const diffTime = target - CONFIG.startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
            if (diffDays >= 1 && diffDays <= CONFIG.totalDays) {
                return diffDays;
            }
            return -1;
        }

        // --- 高性能内存下采样 ---
        function extractImageArts(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        // 1. 色彩抓取
                        const colorCanvas = document.createElement('canvas');
                        const colorCtx = colorCanvas.getContext('2d');
                        colorCanvas.width = 16;
                        colorCanvas.height = 16;
                        colorCtx.drawImage(img, 0, 0, 16, 16);
                        
                        const imgData = colorCtx.getImageData(0, 0, 16, 16).data;
                        const colors = [];
                        
                        for (let i = 0; i < imgData.length; i += 16) {
                            const r = imgData[i];
                            const g = imgData[i+1];
                            const b = imgData[i+2];
                            const a = imgData[i+3];
                            if (a > 150) { 
                                colors.push({ r, g, b });
                            }
                        }
                        if (colors.length === 0) {
                            colors.push({ r: 212, g: 175, b: 55 });
                        }

                        // 2. 内存超微压缩缩略图
                        const thumbCanvas = document.createElement('canvas');
                        const thumbCtx = thumbCanvas.getContext('2d');
                        thumbCanvas.width = 60;
                        thumbCanvas.height = 60;
                        
                        const scale = Math.max(60 / img.width, 60 / img.height);
                        const w = img.width * scale;
                        const h = img.height * scale;
                        
                        thumbCtx.drawImage(img, (60 - w) / 2, (60 - h) / 2, w, h);
                        const tinySrc = thumbCanvas.toDataURL('image/jpeg', 0.5); 

                        resolve({
                            src: tinySrc, 
                            colors: colors
                        });
                        
                        thumbCanvas.width = 1;
                        thumbCanvas.height = 1;
                        colorCanvas.width = 1;
                        colorCanvas.height = 1;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // --- 5. 批量高吞吐解析导入 ---
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        async function handleFiles(files) {
            const total = files.length;
            if (total === 0) return;

            AUDIT.total += total;
            document.getElementById('logTotal').innerText = AUDIT.total;

            progressContainer.classList.remove('hidden');
            let batchSuccess = 0;
            let batchSkipped = 0;
            
            const batchSize = 12; 
            
            for (let i = 0; i < total; i += batchSize) {
                const chunk = Array.from(files).slice(i, i + batchSize);
                
                await Promise.all(chunk.map(async (file) => {
                    const nameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.'));
                    const dateReg = /(\d{4})-(\d{1,2})-(\d{1,2})/;
                    const match = nameWithoutExt.match(dateReg);

                    if (match) {
                        const year = match[1];
                        const month = match[2].padStart(2, '0');
                        const day = match[3].padStart(2, '0');
                        const normalizedDate = `${year}-${month}-${day}`;
                        const dayIdx = getDayIndex(normalizedDate);
                        
                        if (dayIdx !== -1) {
                            const artData = await extractImageArts(file);
                            const slot = timeDataStore[dayIdx];
                            
                            slot.totalCount++;
                            slot.imageColors.push(...artData.colors);
                            slot.images.push(artData.src);
                            
                            // 线性高度公式：严格伴随单天图片张数线性增长
                            slot.heightFactor = 0.1 + slot.totalCount * 0.15;
                            
                            // 同步往本地数据库写入，实现不间断记忆
                            saveImageToLocal(dayIdx, normalizedDate, artData.src, artData.colors);
                            
                            batchSuccess++;
                        } else {
                            batchSkipped++;
                        }
                    } else {
                        batchSkipped++;
                    }
                }));

                const percent = Math.min(100, Math.round(((i + chunk.length) / total) * 100));
                progressBar.style.width = `${percent}%`;
                progressText.innerText = `${percent}%`;
                
                AUDIT.success += batchSuccess;
                AUDIT.skipped += batchSkipped;
                document.getElementById('logSuccess').innerText = AUDIT.success;
                document.getElementById('logSkipped').innerText = AUDIT.skipped;
                updateImgCountUI();

                batchSuccess = 0;
                batchSkipped = 0;

                await new Promise((resolve) => requestAnimationFrame(resolve));
            }

            setTimeout(() => {
                progressContainer.classList.add('hidden');
                progressBar.style.width = `0%`;
            }, 1000);

            showToast(`成功解析融合了 ${total} 幅时空图像并存入本地缓存`);
        }

        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-white/30', 'bg-white/[0.03]');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-white/30', 'bg-white/[0.03]');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-white/30', 'bg-white/[0.03]');
            if (e.dataTransfer.files.length > 0) {
                handleFiles(e.dataTransfer.files);
            }
        });

        // --- 6. 缓存数据彻底清空交互模态框 ---
        const clearDataBtn = document.getElementById('clearDataBtn');
        const confirmModal = document.getElementById('confirmModal');
        const cancelClear = document.getElementById('cancelClear');
        const confirmClear = document.getElementById('confirmClear');

        clearDataBtn.addEventListener('click', () => {
            confirmModal.style.opacity = '1';
            confirmModal.style.pointerEvents = 'auto';
        });

        cancelClear.addEventListener('click', () => {
            confirmModal.style.opacity = '0';
            confirmModal.style.pointerEvents = 'none';
        });

        confirmClear.addEventListener('click', () => {
            confirmModal.style.opacity = '0';
            confirmModal.style.pointerEvents = 'none';
            
            if (db) {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const request = store.clear();
                request.onsuccess = () => {
                    // 清空内存变量
                    for (let i = 1; i <= CONFIG.totalDays; i++) {
                        timeDataStore[i].images = [];
                        timeDataStore[i].imageColors = [];
                        timeDataStore[i].totalCount = 0;
                        timeDataStore[i].heightFactor = 0.1;
                    }
                    AUDIT.total = 0;
                    AUDIT.success = 0;
                    AUDIT.skipped = 0;
                    document.getElementById('logTotal').innerText = 0;
                    document.getElementById('logSuccess').innerText = 0;
                    document.getElementById('logSkipped').innerText = 0;
                    updateImgCountUI();
                    
                    showToast("已成功擦除所有本地缓存图像");
                };
            }
        });

        // --- 7. 底部控制器滑块交互 ---
        const heightSlider = document.getElementById('heightSlider');
        const heightVal = document.getElementById('heightVal');
        heightSlider.addEventListener('input', (e) => {
            CONFIG.heightScale = parseFloat(e.target.value);
            heightVal.innerText = CONFIG.heightScale.toFixed(1);
        });

        const glowSlider = document.getElementById('glowSlider');
        const glowVal = document.getElementById('glowVal');
        glowSlider.addEventListener('input', (e) => {
            CONFIG.glowScale = parseFloat(e.target.value);
            glowVal.innerText = CONFIG.glowScale.toFixed(1);
        });

        const orbitSlider = document.getElementById('orbitSlider');
        const orbitVal = document.getElementById('orbitVal');
        orbitSlider.addEventListener('input', (e) => {
            CONFIG.orbitSpeed = parseFloat(e.target.value);
            orbitVal.innerText = CONFIG.orbitSpeed.toFixed(1);
        });

        const noiseSlider = document.getElementById('noiseSlider');
        const noiseVal = document.getElementById('noiseVal');
        noiseSlider.addEventListener('input', (e) => {
            CONFIG.noiseLevel = parseInt(e.target.value);
            const modes = ['None', 'Low', 'Med', 'High', 'Max'];
            noiseVal.innerText = modes[CONFIG.noiseLevel];
        });

        // --- 视图模式切换 ---
        document.getElementById('toggleLayout').addEventListener('click', () => {
            isLinear = !isLinear;
            const textEl = document.getElementById('layoutText');
            const iconEl = document.querySelector('#toggleLayout i');
            if (isLinear) {
                textEl.innerText = "线性流";
                iconEl.className = "fa-solid fa-chart-simple text-[7px]";
                targetRotationX = 0.15;
                targetRotationY = 0;
            } else {
                textEl.innerText = "环形流";
                iconEl.className = "fa-solid fa-circle-notch text-[7px]";
                targetRotationX = 0.4;
                targetRotationY = 0;
            }
        });

        // --- 鼠标拖拽、滚轮视角旋转 ---
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            lastMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => isDragging = false);

        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (isDragging) {
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                targetRotationY += deltaX * 0.005;
                targetRotationX += deltaY * 0.005;
                targetRotationX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotationX));

                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            } else {
                checkHover(mouseX, mouseY);
            }
        });

        // 放宽滚轮限度
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            targetZoom -= e.deltaY * 0.0008;
            targetZoom = Math.max(0.15, Math.min(2.5, targetZoom));
        }, { passive: false });

        // 触摸兼容
        let touchStartDist = 0;
        canvas.addEventListener('touchstart', (e) => {
            isDragging = true;
            if (e.touches.length === 1) {
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                touchStartDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const rect = canvas.getBoundingClientRect();
            if (e.touches.length === 1) {
                const deltaX = e.touches[0].clientX - lastMouseX;
                const deltaY = e.touches[0].clientY - lastMouseY;
                targetRotationY += deltaX * 0.004;
                targetRotationX += deltaY * 0.004;
                targetRotationX = Math.max(-Math.PI/2, Math.min(Math.PI/2, targetRotationX));
                
                lastMouseX = e.touches[0].clientX;
                lastMouseY = e.touches[0].clientY;

                checkHover(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                targetZoom -= (touchStartDist - dist) * 0.004;
                targetZoom = Math.max(0.15, Math.min(2.5, targetZoom));
                touchStartDist = dist;
            }
        });

        canvas.addEventListener('touchend', () => isDragging = false);

        let projectedNodes = [];

        // 线段投影检测
        function getDistanceToSegment(mx, my, x1, y1, x2, y2) {
            const A = mx - x1;
            const B = my - y1;
            const C = x2 - x1;
            const D = y2 - y1;

            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = -1;
            if (lenSq !== 0) param = dot / lenSq;

            let xx, yy;
            if (param < 0) {
                xx = x1;
                yy = y1;
            } else if (param > 1) {
                xx = x2;
                yy = y2;
            } else {
                xx = x1 + param * C;
                yy = y1 + param * D;
            }

            return Math.hypot(mx - xx, my - yy);
        }

        function checkHover(mX, mY) {
            let minDistance = 24; 
            let foundIndex = -1;

            for (let node of projectedNodes) {
                // 如果节点已被 3D 摄像机裁剪保护，则跳过悬浮触碰检测，防止灵敏度异常和错位
                if (node.baseClip || node.topClip) continue;
                // 使用解耦后的静态稳定线段投影 (baseX/Y 至 topX/Y) 来做碰撞判定，解决膨胀振荡产生的闪烁BUG
                const dist = getDistanceToSegment(mX, mY, node.baseX, node.baseY, node.topX, node.topY);
                if (dist < minDistance) {
                    minDistance = dist;
                    foundIndex = node.dayIndex;
                }
            }

            if (foundIndex !== hoverIndex) {
                hoverIndex = foundIndex;
                if (hoverIndex !== -1) {
                    updateDetailCard(hoverIndex);
                } else {
                    hideDetailCard();
                }
            }
        }

        // --- 悬浮信息面板更新 ---
        function updateDetailCard(index) {
            const data = timeDataStore[index];
            if (!data) return;

            const card = document.getElementById('dateDetails');
            document.getElementById('detailDate').innerText = data.dateStr;
            document.getElementById('detailDayNum').innerText = `第 ${index} 天`;
            document.getElementById('detailCount').innerText = `包含 ${data.totalCount} 幅光影切片`;

            const thumbContainer = document.getElementById('thumbnailContainer');
            thumbContainer.innerHTML = '';
            
            if (data.images.length > 0) {
                const displayLimit = Math.min(data.images.length, 60);
                for (let i = 0; i < displayLimit; i++) {
                    const imgEl = document.createElement('div');
                    imgEl.className = "aspect-square rounded bg-cover bg-center border border-white/5 hover:border-white/25 transition-all";
                    imgEl.style.backgroundImage = `url(${data.images[i]})`;
                    thumbContainer.appendChild(imgEl);
                }
            } else {
                const emptyGlow = document.createElement('div');
                emptyGlow.className = "col-span-5 text-[8px] text-white/20 italic tracking-wider py-2 text-center";
                emptyGlow.innerText = "无时空图像";
                thumbContainer.appendChild(emptyGlow);
            }

            card.style.opacity = '1';
            card.style.transform = 'translateY(-50%) translateX(0px)';
        }

        function hideDetailCard() {
            const card = document.getElementById('dateDetails');
            card.style.opacity = '0';
            card.style.transform = 'translateY(-50%) translateX(-15px)';
        }

        // --- 3D 仿射变换投影 (增加剪裁过滤保护) ---
        function project3D(x, y, z, centerX, centerY) {
            const totalRotationY = rotationY + orbitAngle; 
            const cosY = Math.cos(totalRotationY);
            const sinY = Math.sin(totalRotationY);
            let x1 = x * cosY - z * sinY;
            let z1 = x * sinY + z * cosY;

            const cosX = Math.cos(rotationX);
            const sinX = Math.sin(rotationX);
            let y2 = y * cosX - z1 * sinX;
            let z2 = y * sinX + z1 * cosX;

            const perspective = 700;
            
            // 【相机近剪裁面保护】：防止分母趋向 0 或变负（物体移入相机后方导致的翻转错位 BUG）
            const cameraZ = perspective + z2;
            if (cameraZ <= 30) {
                return {
                    x: -9999,
                    y: -9999,
                    scale: 0,
                    depth: z2,
                    clip: true
                };
            }
            
            const scale = (perspective / cameraZ) * zoom;
            
            return {
                x: centerX + x1 * scale,
                y: centerY + y2 * scale,
                scale: scale,
                depth: z2,
                clip: false
            };
        }

        // --- 核心艺术渲染环路 ---
        function animate() {
            requestAnimationFrame(animate);

            animTick += 0.05;

            rotationX += (targetRotationX - rotationX) * 0.08;
            rotationY += (targetRotationY - rotationY) * 0.08;
            zoom += (targetZoom - zoom) * 0.08;

            if (CONFIG.orbitSpeed > 0 && !isDragging) {
                orbitAngle += CONFIG.orbitSpeed * 0.002;
            }

            ctx.fillStyle = '#030305';
            ctx.fillRect(0, 0, canvas.clientWidth, canvas.clientHeight);

            const cX = canvas.clientWidth / 2;
            const cY = canvas.clientHeight / 2 + 75;

            // 1. 绘制环境背景星尘
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            backgroundParticles.forEach(p => {
                p.y += p.speed;
                if (p.y > canvas.clientHeight) p.y = 0;
                
                const proj = project3D(p.x - cX, p.y - cY - 75, p.z - 100, cX, cY);
                if (proj.clip) return; // 剔除异常剪裁点
                if (proj.x > 0 && proj.x < canvas.clientWidth && proj.y > 0 && proj.y < canvas.clientHeight) {
                    ctx.beginPath();
                    ctx.arc(proj.x, proj.y, p.size * proj.scale, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * proj.scale})`;
                    ctx.fill();
                }
            });

            let renderList = [];
            projectedNodes = [];

            const ringRadius = 260; 

            // 构建所有日期的3D节点
            for (let i = 1; i <= CONFIG.totalDays; i++) {
                const data = timeDataStore[i];
                let x = 0, y = 0, z = 0;

                if (!isLinear) {
                    const angle = ((i - 1) / CONFIG.totalDays) * Math.PI * 2 - Math.PI / 2;
                    x = Math.cos(angle) * ringRadius;
                    z = Math.sin(angle) * ringRadius;
                    y = 0; 
                } else {
                    x = ((i - 1) / CONFIG.totalDays) * 720 - 360;
                    z = 0;
                    y = 60; 
                }

                const isHovered = (i === hoverIndex);
                const hoverHeightMult = isHovered ? 1.4 : 1.0;

                // 物理碰撞层：计算一个不受 Hover 动态高度膨胀影响的“静态稳定”顶部投影坐标
                const stableHeight = isLinear 
                    ? -data.heightFactor * 130 * CONFIG.heightScale
                    : -data.heightFactor * 150 * CONFIG.heightScale;

                const baseProj = project3D(x, y, z, cX, cY);
                const stableTopProj = project3D(x, y + stableHeight, z, cX, cY);

                // 表现渲染层：计算动态缩放变化的高度投影
                const visualHeight = stableHeight * hoverHeightMult;
                const topProj = project3D(x, y + visualHeight, z, cX, cY);

                // 压入碰撞检测队列：一律采用稳定的未扩充基础线段投射，完美解决振荡闪烁
                projectedNodes.push({
                    dayIndex: i,
                    screenX: baseProj.x,
                    screenY: (baseProj.y + stableTopProj.y) / 2,
                    baseX: baseProj.x,
                    baseY: baseProj.y,
                    topX: stableTopProj.x,
                    topY: stableTopProj.y,
                    baseClip: baseProj.clip,
                    topClip: stableTopProj.clip
                });

                renderList.push({
                    type: 'bar',
                    dayIndex: i,
                    depth: baseProj.depth,
                    baseProj: baseProj,
                    topProj: topProj,
                    data: data,
                    x: x, y: y + visualHeight, z: z,
                    rawHeight: Math.abs(visualHeight),
                    isHovered: isHovered
                });

                // 月份数字
                const currentDate = new Date(CONFIG.startDate);
                currentDate.setDate(CONFIG.startDate.getDate() + (i - 1));
                if (currentDate.getDate() === 1) {
                    const monthNum = currentDate.getMonth() + 1;
                    
                    let labelX = x;
                    let labelZ = z;
                    let labelY = y + 16; 
                    
                    if (!isLinear) {
                        const angle = ((i - 1) / CONFIG.totalDays) * Math.PI * 2 - Math.PI / 2;
                        labelX = Math.cos(angle) * (ringRadius + 38);
                        labelZ = Math.sin(angle) * (ringRadius + 38);
                    }

                    const labelProj = project3D(labelX, labelY, labelZ, cX, cY);

                    renderList.push({
                        type: 'label',
                        depth: labelProj.depth + 5, 
                        proj: labelProj,
                        text: `${monthNum}`,
                        isSpecial: monthNum === 9 
                    });
                }
            }

            // 【深度排序优化】：画家算法排序，在深度极接近时引入唯一的 dayIndex 作为稳定打破僵局变量，解决 Z轴冲突闪烁
            renderList.sort((a, b) => {
                if (Math.abs(b.depth - a.depth) < 0.01) {
                    return b.dayIndex - a.dayIndex; 
                }
                return b.depth - a.depth;
            });

            // 绘制
            renderList.forEach(obj => {
                if (obj.type === 'bar') {
                    drawFineArtBar(obj);
                } else if (obj.type === 'label') {
                    drawMinimalLabel(obj);
                }
            });
        }

        // --- 极致流畅的多段半透明画笔叠加（极光辉光优化版） ---
        function drawFineArtBar(bar) {
            const { baseProj, topProj, data, dayIndex, rawHeight, isHovered } = bar;

            // 【3D 剪裁面保护过滤】：如果被剪裁至相机后方，直接跳过渲染，防止突发反转错位
            if (baseProj.clip || topProj.clip) return; 

            const scaleFactor = baseProj.scale;
            if (scaleFactor < 0.1) return; 

            const hasImages = data.totalCount > 0;
            
            const baseWidth = hasImages ? (0.8 * scaleFactor + Math.min(60, data.totalCount) * 0.1) : (0.35 * scaleFactor);
            const barWidth = isHovered ? (baseWidth * 2.5) : baseWidth;

            const colors = data.imageColors;
            const mainColor = colors.length > 0 ? colors[0] : { r: 255, g: 255, b: 255 };

            ctx.save();
            ctx.lineCap = 'round';
            
            // 1. 发光极光空气层
            if (hasImages) {
                const glowIntensity = CONFIG.glowScale * (isHovered ? 2.5 : 1.0);
                
                // 第一层
                ctx.beginPath();
                ctx.moveTo(baseProj.x, baseProj.y);
                ctx.lineTo(topProj.x, topProj.y);
                ctx.strokeStyle = `rgba(${mainColor.r}, ${mainColor.g}, ${mainColor.b}, ${0.05 * glowIntensity})`;
                ctx.lineWidth = barWidth * 8.0;
                ctx.stroke();

                // 第二层
                ctx.beginPath();
                ctx.moveTo(baseProj.x, baseProj.y);
                ctx.lineTo(topProj.x, topProj.y);
                ctx.strokeStyle = `rgba(${mainColor.r}, ${mainColor.g}, ${mainColor.b}, ${0.12 * glowIntensity})`;
                ctx.lineWidth = barWidth * 4.5;
                ctx.stroke();

                // 第三层
                ctx.beginPath();
                ctx.moveTo(baseProj.x, baseProj.y);
                ctx.lineTo(topProj.x, topProj.y);
                ctx.strokeStyle = `rgba(${mainColor.r}, ${mainColor.g}, ${mainColor.b}, ${0.25 * glowIntensity})`;
                ctx.lineWidth = barWidth * 2.2;
                ctx.stroke();
            } else {
                if (isHovered) {
                    ctx.beginPath();
                    ctx.moveTo(baseProj.x, baseProj.y);
                    ctx.lineTo(topProj.x, topProj.y);
                    ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 * CONFIG.glowScale})`;
                    ctx.lineWidth = barWidth * 4.0;
                    ctx.stroke();
                }
            }

            // 2. 核心高透亮渐变实体光柱
            ctx.beginPath();
            ctx.moveTo(baseProj.x, baseProj.y);
            ctx.lineTo(topProj.x, topProj.y);

            const grad = ctx.createLinearGradient(baseProj.x, baseProj.y, topProj.x, topProj.y);
            if (hasImages && colors.length > 1) {
                const stopCount = Math.min(colors.length, 4); 
                for (let step = 0; step < stopCount; step++) {
                    const idx = Math.floor((step / (stopCount - 1)) * (colors.length - 1));
                    const c = colors[idx];
                    grad.addColorStop(step / (stopCount - 1), `rgba(${c.r}, ${c.g}, ${c.b}, ${isHovered ? 1.0 : 0.8})`);
                }
            } else if (hasImages && colors.length === 1) {
                grad.addColorStop(0, `rgba(${mainColor.r}, ${mainColor.g}, ${mainColor.b}, 0.2)`);
                grad.addColorStop(1, `rgba(${mainColor.r}, ${mainColor.g}, ${mainColor.b}, ${isHovered ? 1.0 : 0.85})`);
            } else {
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.01)');
                grad.addColorStop(1, isHovered ? 'rgba(255, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.05)');
            }

            ctx.strokeStyle = grad;
            ctx.lineWidth = barWidth;
            ctx.stroke();
            ctx.restore();

            // 3. 【极光颗粒动态 Shimmer】
            if (CONFIG.noiseLevel > 0 && (hasImages || isHovered)) {
                ctx.save();
                const waveSpeed = CONFIG.noiseLevel * 0.15;
                const noiseDensity = CONFIG.noiseLevel * 1.5;
                const particleCount = Math.min(Math.floor(rawHeight * noiseDensity), 60);

                for (let p = 0; p < particleCount; p++) {
                    const basePhase = Math.sin(dayIndex * 12.9898 + p * 78.233);
                    const dynamicRatio = Math.abs(basePhase + (animTick * waveSpeed)) % 1.0;
                    
                    const px = baseProj.x + (topProj.x - baseProj.x) * dynamicRatio;
                    const py = baseProj.y + (topProj.y - baseProj.y) * dynamicRatio;

                    const spreadSeed = Math.sin(dayIndex * 43.12 + p * 19.87 + animTick * waveSpeed * 1.5);
                    const spread = (barWidth * 0.55) * spreadSeed;
                    const finalX = px + (topProj.y - baseProj.y) / rawHeight * spread;
                    const finalY = py - (topProj.x - baseProj.x) / rawHeight * spread;

                    let pColor = 'rgba(255, 255, 255, 0.2)';
                    if (colors.length > 0) {
                        const randomColor = colors[Math.floor(Math.abs(spreadSeed * 100) % colors.length)];
                        pColor = `rgba(${randomColor.r}, ${randomColor.g}, ${randomColor.b}, ${isHovered ? 0.9 : 0.55})`;
                    }

                    ctx.fillStyle = pColor;
                    const grainSize = (0.6 * scaleFactor) * (isHovered ? 1.5 : 1.0);
                    ctx.fillRect(finalX, finalY, grainSize, grainSize);
                }
                ctx.restore();
            }

            if (isHovered) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(topProj.x, topProj.y, 4 * scaleFactor, 0, Math.PI * 2);
                ctx.fillStyle = hasImages ? `rgba(${mainColor.r}, ${mainColor.g}, ${mainColor.b}, 0.95)` : 'rgba(255, 255, 255, 0.6)';
                ctx.fill();
                ctx.restore();
            }
        }

        // --- 绘制优雅月份标签 ---
        function drawMinimalLabel(labelObj) {
            const { proj, text, isSpecial } = labelObj;
            if (proj.clip) return; // 剔除异常剪裁点
            if (proj.scale < 0.2) return;

            ctx.save();
            ctx.font = `600 ${Math.floor(13 * proj.scale)}px 'Cinzel', serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            if (isSpecial) {
                ctx.fillStyle = `rgba(255, 255, 255, ${1.0 * proj.scale})`; 
            } else {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.55 * proj.scale})`; 
            }

            ctx.fillText(text, proj.x, proj.y);
            ctx.restore();
        }

        // 启动艺术引擎并读取本地缓存
        window.onload = async function() {
            animate();
            
            // 初始化本地数据库并抓取先前保存的照片
            const dbReady = await initIndexedDB();
            if (dbReady) {
                loadImagesFromLocal();
            } else {
                showToast("未能开启本地数据记忆");
            }
        };
    </script>

</body></html>
